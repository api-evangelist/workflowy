aid: workflowy
name: Workflowy
description: Workflowy is a minimalist infinite outliner for organizing notes,
  tasks, and ideas in a single infinitely nested, zoomable bullet list, with
  mirrors, kanban boards, real-time collaboration, an AI writing assistant, and
  apps for web, iOS, Android, macOS, and Windows. For developers Workflowy ships
  an official REST API (nodes and targets at workflowy.com/api/v1, API-key bearer
  auth), an open-source CLI (wf) with an embedded MCP server, a desktop MCP app
  for connecting AI agents like Claude and Cursor, and a published llms.txt. A
  Bloomberg Beta portfolio company.
